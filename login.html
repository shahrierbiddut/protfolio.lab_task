<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Employee Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Employee Login</h2>

    <!-- login form -->
    <form id="loginForm">
      <label>Username/Email</label>
      <input type="text" id="username" placeholder="Enter username or email" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" required>

      <button type="submit" class="btn">Log In</button>

      <p class="form-footer">Don't have an account? 
        <a href="register.html">Register</a>
      </p>
    </form>
  </div>

  <!-- JavaScript redirect logic -->
  <script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', function(event) {
      event.preventDefault(); // prevent form reload

      // optional: simple validation (demo only)
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (username && password) {
        // fake login success → redirect to admin.html
        window.location.href = "admin.html";
      } else {
        alert("Please enter username and password!");
      }
    });
  </script>

</body>
</html>
